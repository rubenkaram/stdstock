<style>
/* Layout: barra superior fija con estado de datos, pestañas de trabajo, tablas densas tipo planilla */
:root{

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

.brand{display:flex;flex-direction:column;min-width:0}

.chip b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}

main{padding-top:20px;display:grid;gap:18px}

.sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:80ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

.tile .n{font-size:12px;color:var(--faint)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{appearance:none;font:600 13px var(--f-body);border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}

td input.fin.chg{border-color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bajo{background:var(--warn-soft);color:var(--warn)}.p-quiebre{background:var(--crit-soft);color:var(--crit)}.p-exceso{background:var(--info-soft);color:var(--info)}.p-sin{background:var(--surface2);color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted);margin-right:3px}
.tag.w{border-color:var(--warn);color:var(--warn)}.tag.c{border-color:var(--crit);color:var(--crit)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}

.card label.file{justify-self:start}
.req{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.opt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.map label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.bars{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden}
.bars span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.params label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.params label small{color:var(--faint)}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:hover{background:var(--surface2)}
.list-row.sel{background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
@media (max-width:640px){.tile .v{font-size:19px}.brand h1{font-size:19px}header.top{position:static}.chip{white-space:normal}.toprow{padding-block:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>

}

:root[data-theme="dark"]{

  --accent:#6da7ec; --accent-soft:#1b2d45; --on-accent:#0f1216;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.src{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.src b{font-family:var(--f-mono);font-weight:500}
.btn{font:inherit;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line-strong);border-radius:8px;padding:10px 14px;color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,var(--line-strong))}

/* filter strip */
.filters{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.chip.on{border-color:var(--c)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
select{font:inherit;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px 13px;min-width:0}

<script>
const EMBED = null;
const EMBED_NAME = "";

const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_L=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const TIPOS=[{k:"DIARIO",l:"Diario",v:"--s1"},{k:"GARANTIA",l:"Garantía",v:"--s2"},{k:"URGENTE",l:"Urgente",v:"--s3"}];
const EST={facturado:{l:"Facturado",v:"--good"},pendiente:{l:"Pendiente / BO",v:"--warn"},cancelado:{l:"Cancelado",v:"--crit"}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);
const fmt$=n=>"$ "+Math.round(n).toLocaleString("es-AR");
const fmtM=n=>{const a=Math.abs(n);if(a>=1e6)return "$ "+(n/1e6).toLocaleString("es-AR",{maximumFractionDigits:a>=1e8?0:1})+" M";if(a>=1e3)return "$ "+(n/1e3).toLocaleString("es-AR",{maximumFractionDigits:0})+" k";return "$ "+Math.round(n)};
const fmtN=n=>Math.round(n).toLocaleString("es-AR");
const pct=(a,b)=>b?(a/b*100):0;
const fmtP=x=>x.toLocaleString("es-AR",{maximumFractionDigits:1})+" %";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ROWS=[], LINES=[], ORDERS=[];
let state={tipos:new Set(TIPOS.map(t=>t.k)),mes:"all",segMes:"ped",segTipo:"ped",segEst:"imp",segTop:"imp",tab:"ped",q:"",sort:null,open:new Set()};

/* ---------- parsing ---------- */
function parseDate(v){
  if(v==null)return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());}
  const s=String(v).trim(); if(!s)return null;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  return null;
}
const num=v=>{if(v==null||v==="")return 0;if(typeof v==="number")return v;const s=String(v).trim();if(!s||s==="-")return 0;const n=parseFloat(s.replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(n)?0:n};
const code=v=>String(v??"").replace(/\s+/g,"").trim();
const txt=v=>{const s=String(v??"").trim();return s==="-"?"":s};
function norm(h){return String(h??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9#]/g,"")}

let SRC_NAME="";
function load(aoa,name){
  let hi=aoa.findIndex(r=>r&&r.some(c=>norm(c)==="fechapedido"));
  if(hi<0)throw new Error("No encontré la columna “Fecha pedido”. Usá el Excel exportado del portal de pedidos de Ford con el mismo formato.");
  const H=aoa[hi].map(norm), col=k=>H.indexOf(k);
  const C={fp:col("fechapedido"),np:col("npedido"),tp:col("tipopedido"),it:col("item"),pp:col("piezapedida"),qp:col("#pedida"),pf:col("piezafacturada"),qf:col("#facturada"),es:col("estado"),cj:col("caja"),nf:col("nfactura"),ff:col("fechafactura"),pu:col("preciounitarioitem"),de:col("descuento"),co:col("comentario"),vt:col("valortotal"),vin:col("vin")};
  const miss=["fp","np","tp","pp","qf","es","vt"].filter(k=>C[k]<0);
  if(miss.length)throw new Error("Faltan columnas en el archivo: "+miss.join(", "));
  const g=(r,k)=>C[k]<0?null:r[C[k]];
  const rows=[];
  for(const r of aoa.slice(hi+1)){
    if(!r||!g(r,"np"))continue;
    const fp=parseDate(g(r,"fp")); if(!fp)continue;
    const tRaw=txt(g(r,"tp")).toUpperCase();
    const tipo=TIPOS.find(t=>tRaw.includes(t.k))?.k||(tRaw.includes("GARANT")?"GARANTIA":tRaw.includes("URG")?"URGENTE":"DIARIO");
    const eRaw=txt(g(r,"es")); const ec=parseInt(eRaw);
    const est=(ec===70||ec===86)?"facturado":ec===95?"cancelado":"pendiente";
    rows.push({fp,np:txt(g(r,"np")),tipo,item:txt(g(r,"it")),pp:code(g(r,"pp")),pf:code(g(r,"pf"))||code(g(r,"pp")),qp:num(g(r,"qp")),qf:num(g(r,"qf")),
      eRaw,ec,est,caja:txt(g(r,"cj")),nf:txt(g(r,"nf")),ff:parseDate(g(r,"ff")),pu:num(g(r,"pu")),de:txt(g(r,"de")),co:txt(g(r,"co")),vt:num(g(r,"vt")),vin:txt(g(r,"vin"))});
  }
  if(!rows.length)throw new Error("El archivo no tiene filas de pedidos.");
  rows.forEach(r=>{r.mk=r.fp.getFullYear()+"-"+String(r.fp.getMonth()+1).padStart(2,"0");r.lead=(r.est==="facturado"&&r.ff)?Math.max(0,Math.round((new Date(r.ff.getFullYear(),r.ff.getMonth(),r.ff.getDate())-new Date(r.fp.getFullYear(),r.fp.getMonth(),r.fp.getDate()))/864e5)):null;r.desc=num(String(r.de).replace("%",""));r.bruto=r.pu*r.qf});
  ROWS=rows;SRC_NAME=name;showDash(true);
  $("srcName").textContent=name;
  const ds=rows.map(r=>r.fp).sort((a,b)=>a-b);
  $("srcRange").textContent="pedidos del "+ds[0].toLocaleDateString("es-AR")+" al "+ds.at(-1).toLocaleDateString("es-AR")+" · "+fmtN(rows.length)+" filas";
  const months=[...new Set(rows.map(r=>r.mk))].sort();
  $("mes").innerHTML='<option value="all">Todos los meses</option>'+months.map(m=>`<option value="${m}">${MESES_L[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join("");
  state.mes="all";$("mes").value="all";state.open.clear();
  buildChips();render();
}

/* ---------- aggregation ---------- */
function filtered(withMonth=true){return ROWS.filter(r=>state.tipos.has(r.tipo)&&(!withMonth||state.mes==="all"||r.mk===state.mes))}
function lineKey(r){return r.np+"|"+r.item+"|"+r.pp}
function summarize(rs){
  const ped=new Set(),cod=new Set(),codF=new Set(),fac=new Set(),lines=new Set();
  let uP=0,uF=0,uPe=0,uC=0,iP=0,iF=0,iPe=0,iC=0,bruto=0,leadS=0,leadN=0,subs=0;
  for(const r of rs){
    ped.add(r.np);cod.add(r.pp);lines.add(lineKey(r));uP+=r.qf;iP+=r.vt;
    if(r.est==="facturado"){uF+=r.qf;iF+=r.vt;codF.add(r.pf);if(r.nf)fac.add(r.nf);bruto+=r.bruto;if(r.lead!=null){leadS+=r.lead;leadN++}}
    else if(r.est==="pendiente"){uPe+=r.qf;iPe+=r.vt}else{uC+=r.qf;iC+=r.vt}
  }

async function runExport(btn,kind){
  if(!ROWS.length)return;
  const need=kind==="pdf"?(window.jspdf&&window.jspdf.jsPDF&&window.Chart):(window.ExcelJS&&window.Chart);
  if(!need){toast("No se pudieron cargar las herramientas del informe. Revisá la conexión y recargá la página.");return}
  const lbl=btn.innerHTML;btn.disabled=true;btn.lastChild.textContent=" Generando…";
  try{
    await new Promise(r=>setTimeout(r,30));
    const base="Informe pedidos repuestos "+(state.mes==="all"?"":mesL(state.mes)+" ")+stamp();
    if(kind==="pdf")await saveFile(base+".pdf",await makePDF());
    else await saveFile(base+".xlsx",await makeXLSX());
  }catch(e){console.error(e);toast("No se pudo generar el informe: "+(e.message||e))}
  finally{btn.disabled=false;btn.innerHTML=lbl}
}

function boReportData(){
  const all=boRows(filtered(true));

  const rows=all.filter(r=>cats.includes(r.cat));
  const sum=rr=>({n:rr.length,u:rr.reduce((a,r)=>a+r.faltan,0),imp:rr.reduce((a,r)=>a+r.vt,0),old:rr[0]||null,ped:new Set(rr.map(r=>r.np)).size});

  const ageTot=BO_BUCKETS.map(b=>sum(rows.filter(r=>r.dias>=b[0]&&r.dias<=b[1])));

<script>/* Adaptador Supabase: guarda los datos de la app en la tabla "docs" y los archivos exportados en el bucket "archivos" */
window.__LOCAL = true; // habilita Respaldo en Parámetros
(function () {
  const valid = c => c && /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(String(c.SUPABASE_URL || '').trim()) && /^(sb_publishable_|eyJ)/.test(String(c.SUPABASE_ANON_KEY || '').trim()) && !/sb_secret_/.test(c.SUPABASE_ANON_KEY);

    const show = () => { const el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);padding:16px';

      document.body.appendChild(el); };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
    window.claude = { use: () => new Promise(() => {}) };
  }
  if (!cfg) {
    const show = () => { const el = document.createElement('div'); el.id = 'setup';
      el.style.cssText = 'position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);padding:16px';
      el.innerHTML = `<form style="width:min(460px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;font-size:14px"><b style="font-size:17px">Conectar con Supabase</b><div class="sub" style="margin:0">Se hace una sola vez en cada computadora. Los datos están en Supabase, en el botón <b>Connect</b> del proyecto (o Project Settings &gt; API Keys).</div><label style="display:grid;gap:4px;color:var(--muted);font-size:13px">Project URL<input type="text" id="suUrl" placeholder="https://abcdefgh.supabase.co"></label><label style="display:grid;gap:4px;color:var(--muted);font-size:13px">Publishable key<input type="text" id="suKey" placeholder="sb_publishable_..."></label><div id="suMsg" style="color:var(--crit);font-size:13px;min-height:1em"></div><button class="btn pri" type="submit">Guardar y conectar</button></form>`;
      document.body.appendChild(el);
      el.querySelector('form').addEventListener('submit', e => { e.preventDefault(); e.stopPropagation();
        const c = { SUPABASE_URL: document.getElementById('suUrl').value.trim().replace(/\/+$/, ''), SUPABASE_ANON_KEY: document.getElementById('suKey').value.trim() };
        if (!valid(c)) { document.getElementById('suMsg').textContent = /sb_secret_/.test(c.SUPABASE_ANON_KEY) ? 'Esa es la Secret key: usá la Publishable key.' : 'Revisá: la URL termina en .supabase.co y la clave empieza con sb_publishable_'; return; }
        localStorage.setItem('stdstock-supabase', JSON.stringify(c)); location.reload(); }, true);
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
    window.claude = { use: () => new Promise(() => {}) };
    return;
  }
  if (!window.supabase || !window.supabase.createClient) { fatal('No se pudo descargar la librería de Supabase. Revisá la conexión a internet y recargá con Ctrl+F5.'); return; }
  let sb; try { sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); } catch (e) { fatal('Supabase rechazó la configuración: ' + e.message); return; }
  const mem = new Map(); const listeners = {};
  const err = e => ({ code: 'unavailable', message: (e && e.message) || String(e) });
  const notify = p => { const col = p.split('/').slice(0, -1).join('/'); (listeners[col] || []).forEach(f => f()); };
  async function put(path, data) {
    const v = JSON.parse(JSON.stringify(data)); mem.set(path, v);
    const { error } = await sb.from('docs').upsert({ path, data: v, updated_at: new Date().toISOString() });
    if (error) throw err(error); notify(path);
  }
  async function del(path) {
    mem.delete(path); const { error } = await sb.from('docs').delete().eq('path', path);
    if (error) throw err(error); notify(path);
  }
  const snap = p => { const d = mem.get(p); return { id: p.split('/').pop(), exists: d !== undefined, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docRef = p => ({ id: p.split('/').pop(), path: p, get: async () => snap(p), set: d => put(p, d), delete: () => del(p),
    update: async d => { const cur = mem.get(p); if (cur === undefined) throw { code: 'invalid_argument', message: 'no existe' }; await put(p, Object.assign({}, cur, d)); },
    collection: c => colRef(p + '/' + c) });
  function colRef(c) {
    const docsOf = () => [...mem.keys()].filter(k => k.startsWith(c + '/') && k.slice(c.length + 1).indexOf('/') < 0).sort().map(snap);
    return { path: c, doc: id => docRef(c + '/' + (id || newId())),
      add: async d => { const r = docRef(c + '/' + newId()); await r.set(d); return r; },
      get: async () => { const docs = docsOf(); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot: next => { const f = () => { const docs = docsOf(); next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }); };
        (listeners[c] || (listeners[c] = [])).push(f); setTimeout(f, 0); return () => { listeners[c] = listeners[c].filter(x => x !== f); }; } };
  }
  async function loadAll() {
    mem.clear(); let from = 0; const step = 200;
    for (;;) {
      const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from + step - 1);
      if (error) throw err(error);

    }
  }
  const stamp = () => new Date().toISOString().slice(0, 7);
  const downloads = { save: async ({ filename, data }) => {

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    const safe = filename.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\- ]+/g, '-');
    const { error } = await sb.storage.from('archivos').upload(`exportados/${stamp()}/${safe}`, blob, { upsert: true });
    if (error) console.warn('No se pudo subir a Supabase Storage', error);
    return { status: 'saved' };
  } };
  window.__backup = () => JSON.stringify(Object.fromEntries(mem));
  function panel(html) {
    let el = document.getElementById('restoreBox');
    if (!el) { el = document.createElement('div'); el.id = 'restoreBox';
      el.style.cssText = 'position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px';
      document.body.appendChild(el); }
    el.innerHTML = `<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(440px,100%);display:grid;gap:10px;font-size:14px">${html}</div>`;
    return el;
  }
  window.__restore = async json => {
    let o; try { o = JSON.parse(json); } catch (e) { throw new Error('el archivo no es un respaldo válido'); }
    if (!o['config/params']) throw new Error('no es un respaldo de esta app');
    const entries = Object.entries(o); const fails = [];
    panel(`<b>Restaurando respaldo…</b><div id="rsMsg">Borrando datos anteriores</div>`);
    const { error: e1 } = await sb.from('docs').delete().neq('path', '');
    if (e1) { panel(`<b>No se pudo restaurar</b><div>Supabase no dejó borrar los datos anteriores: ${e1.message}</div><button class="btn" onclick="this.closest('#restoreBox').remove()">Cerrar</button>`); throw new Error(e1.message); }
    for (let i = 0; i < entries.length; i++) {
      const [path, data] = entries[i];
      const m = document.getElementById('rsMsg'); if (m) m.textContent = `Subiendo ${i + 1} de ${entries.length}: ${path}`;
      let ok = false, last = null;
      for (let t = 0; t < 3 && !ok; t++) { const { error } = await sb.from('docs').upsert({ path, data, updated_at: new Date().toISOString() }); if (error) { last = error; await new Promise(r => setTimeout(r, 800)); } else ok = true; }
      if (!ok) fails.push(`${path}: ${last && last.message}`);
    }
    const { count, error: e2 } = await sb.from('docs').select('path', { count: 'exact', head: true });
    const got = e2 ? '?' : count;
    if (fails.length || got !== entries.length) {

function bindChart(){

  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>max/x<=5)||step*10;const top=Math.ceil(max/nice)*nice;
  const bw=(W-pl-pr)/idx.length,y=v=>pt+(H-pt-pb)*(1-v/top);

  const bars=idx.map((i,k)=>{const x=pl+k*bw+bw*.2,w=bw*.6,yy=y(vals[i]),h=H-pb-yy,r=Math.min(4,w/2,h);
    return `<path d="M${x},${H-pb} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+w-r} Q${x+w},${yy} ${x+w},${yy+r} V${H-pb} Z" fill="var(--bar)"/><rect x="${pl+k*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-i="${i}"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${fMes(ms[i])}</text>`}).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades vendidas por mes">${g}${bars}</svg><div class="tip" hidden></div>`;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('rect[data-i]').forEach(r=>{r.addEventListener('mouseenter',()=>{const i=+r.dataset.i;const b=r.getBoundingClientRect(),e=el.getBoundingClientRect();tip.textContent=`${fMes(ms[i])}: ${fN(vals[i])} u`;tip.style.left=(b.left-e.left+b.width/2)+'px';tip.style.top=(e.height*(y(vals[i])/H))+'px';tip.hidden=false});r.addEventListener('mouseleave',()=>tip.hidden=true)});
}

const FYB_MODE={ped:'Pedido a Ford',excel:'Solo el Excel',sug:'Sugerido guardado',cmp:'Pedido vs sugerido'};
function fybMatrix(){
  const F=S.fyb,u=S.ui,sucs=u.fybSuc?[u.fybSuc]:S.sucs;const items=F.items;const keys=new Set(items.map(x=>fkey(x[1])));
  const add=(m,k,mo,q)=>{const o=m.get(k)||{};o[mo]=(o[mo]||0)+q;m.set(k,o)};
  const ex=new Map(),wg=new Map(),sg=new Map(),cover={},months=new Set();
  for(const [c,mo,su,q] of F.hist)if(sucs.includes(su)){add(ex,fkey(c),mo,q);months.add(mo)}
  for(const su of sucs){const d=F.pm[su];if(!d)continue;cover[su]=[d.meta.desde,d.meta.hasta];for(const [c,mo,q] of d.rows){const k=fkey(c);if(keys.has(k)){add(wg,k,mo,q)}months.add(mo)}}
  for(const x of S.saved){if(!sucs.includes(x.sucursal))continue;const mo=String(x.fecha).slice(0,7);let L=[];try{L=JSON.parse(x.lines||'[]')}catch(e){}
    for(const r of L){const k=fkey(r[0]);if(keys.has(k)&&r[5]>0){add(sg,k,mo,r[5]);months.add(mo)}}}
  const covered=mo=>sucs.length&&sucs.every(su=>cover[su]&&mo>=cover[su][0].slice(0,7)&&mo<=cover[su][1].slice(0,7));
  const partly=mo=>sucs.some(su=>cover[su]&&mo>=cover[su][0].slice(0,7)&&mo<=cover[su][1].slice(0,7));
  const ped=(k,mo)=>{let t=0;for(const su of sucs){const c=cover[su];if(c&&mo>=c[0].slice(0,7)&&mo<=c[1].slice(0,7)){const d=F.pm[su];t+=(d._idx||(d._idx=(()=>{const m=new Map();for(const [cc,m2,q] of d.rows){const kk=fkey(cc)+'|'+m2;m.set(kk,(m.get(kk)||0)+q)}return m})())).get(k+'|'+mo)||0}
      else for(const [c2,m2,su2,q] of F.hist)if(su2===su&&m2===mo&&fkey(c2)===k)t+=q}return t};
  return {sucs,ex,wg,sg,months:[...months].sort(),covered,partly,ped};
}
function vFyb(){

  const src=mo=>mode==='ped'?(X.covered(mo)?'Wings':X.partly(mo)?'Wings + Excel':'Excel'):'';
  let body='';
  for(const cat of cats){const its=F.items.filter(x=>x[0]===cat&&(!q||x[1].includes(q)||x[2].toUpperCase().includes(q)||x[3].toUpperCase().includes(q)));if(!its.length)continue;

const CR={std:['Estándar','Piezas del estándar de la sucursal, primero las de más plata en stock'],ven:['Más vendidos','Las más vendidas del período en unidades'],caro:['Más caros vendidos','Las de mayor costo unitario entre las vendidas del período'],todo:['Todo el stock','Todas las piezas con stock, primero las de más plata: asegura que con el tiempo se controle todo'],mix:['Mixto','Un poco de cada criterio en el mismo control']};

/* stock físico por código: N y P juntos (están en la misma estantería con el mismo código) */
function ctrlStock(){
  const m=new Map();if(!S.D.stock)return m;
  for(const r of S.D.stock.rows){const q=num(r[2]),cost=r[3]==null||r[3]===''?null:num(r[3]);let o=m.get(r[0]);
    if(!o){o={q:0,val:0,vq:0,orig:'',desc:r[1]};m.set(r[0],o)}o.q+=q;if(cost!=null&&q>0){o.val+=cost*q;o.vq+=q}const og=r[5]||'';if(og&&o.orig.indexOf(og)<0)o.orig+=(o.orig?'+':'')+og}
  for(const o of m.values())o.cost=o.vq?o.val/o.vq:null;return m;
}
function ctrlUniverse(cr){
  const L=(S.res&&S.res.lines)||[],top=ctrlCfg().top;const v=l=>Math.max(0,l.st)*(l.cost||0);
  if(cr==='std')return L.filter(l=>l.inStd).sort((a,b)=>v(b)-v(a)||b.q6-a.q6);
  if(cr==='ven')return L.filter(l=>l.q6>0).sort((a,b)=>b.q6-a.q6).slice(0,top);
  if(cr==='caro')return L.filter(l=>l.q6>0&&l.cost).sort((a,b)=>b.cost-a.cost).slice(0,top);
  return L.filter(l=>l.st>0).sort((a,b)=>v(b)-v(a));
}

function ctrlProgress(cr){const U=ctrlUniverse(cr),V=ctrlVuelta(cr),done=ctrlDoneSince(V.desde);const pend=U.filter(l=>!done.has(l.code));return {U,V,pend,hechas:U.length-pend.length}}
function ctrlShare(){const n=ctrlCfg().n,b=Math.floor(n/4),r=n-b*4;const o={};CR4.forEach((k,i)=>o[k]=b+(i<r?1:0));return o}
async function ctrlUbic(){
  const d=(S.depos||[]).filter(x=>x.sucursal===S.P.sucursal).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];const m=new Map();if(!d)return m;

async function ctrlGen(){
  if(!S.D.stock){toast('Cargá el stock de '+S.P.sucursal+' antes de generar el control.');return}
  const cfg=ctrlCfg(),cr=S.ui.ctrlCr||'mix',n=cfg.n;const want=cr==='mix'?ctrlShare():{[cr]:n};
  const pick=[],seen=new Set(),vu={};
  for(const k of CR4){let q=want[k]||0;if(!q)continue;
    let P=ctrlProgress(k);if(!P.U.length)continue;
    if(!P.pend.length){const V=ctrlVuelta(k);V.n++;V.desde=new Date().toISOString();P=ctrlProgress(k)}
    vu[k]=ctrlVuelta(k).n;
    for(const l of P.pend){if(!q)break;if(seen.has(l.code))continue;seen.add(l.code);pick.push([l,k]);q--}
  }
  /* si un criterio del mixto no alcanza, completa con Todo el stock */
  if(pick.length<n){const P=ctrlProgress('todo');for(const l of P.pend){if(pick.length>=n)break;if(!seen.has(l.code)){seen.add(l.code);pick.push([l,'todo'])}}}

function ctrlSum(c){

  R.exact=R.cont?R.ok/R.cont*100:null;R.neto=R.sob$-R.fal$;return R;
}

function detectHeader(kind,aoa){
  const pats=KINDS[kind].f.flatMap(f=>f[2]);let best=0,bs=-1;
  for(let i=0;i<Math.min(40,aoa.length);i++){const r=aoa[i]||[];let s=0;for(const c of r){if(c==null)continue;const t=String(c).trim().toLowerCase();if(pats.some(p=>p.test(t)))s++}if(s>bs){bs=s;best=i}}
  if(kind==='ddp'||bs<=0)return 0;return best;
}
function autoMap(){
  const p=S.pending,hdr=(p.aoa[p.h]||[]).map(c=>c==null?'':String(c).trim().toLowerCase());const used=new Set();p.map={};
  if(p.kind==='ddp'){
    const rows=p.aoa.slice(p.h+1,p.h+300),n=hdr.length||Math.max(...rows.map(r=>r.length));let flag=-1,fc=0,code=-1,cc=-1;
    for(let i=0;i<n;i++){let f=0,c=0;for(const r of rows){const v=r[i];if(v==null)continue;const s=String(v).trim();if(/^[DNS]$/.test(s))f++;if(s.includes('/')&&!/\S\s+\S/.test(s))c++}if(f>fc){fc=f;flag=i}if(c>cc){cc=c;code=i}}
    p.map={code,flag};return}
  for(const [key,,pats,,mode] of KINDS[p.kind].f){let found=-1;
    for(const re of pats){const idx=hdr.map((h,i)=>re.test(h)&&!used.has(i)?i:-1).filter(i=>i>=0);if(idx.length){found=mode==='last'?idx[idx.length-1]:idx[0];break}}
    p.map[key]=found;if(found>=0)used.add(found)}
}

async function mergePedMes(suc,rows){

  const cur=await readDataset(dsName('pedmes',suc));const months=[...new Set(rows.map(r=>r[1]))].sort(),first=months[0],ms=new Set(months);
  const prevFirst=new Map();const keep=[];
  for(const r of (cur?cur.rows:[])){if(!ms.has(r[1]))keep.push(r);else if(r[1]===first)prevFirst.set(r[0],r[2])}
  const add=rows.map(r=>r[1]===first&&prevFirst.has(r[0])?[r[0],r[1],Math.max(r[2],prevFirst.get(r[0]))]:r);
  for(const [c,q] of prevFirst)if(!rows.some(r=>r[0]===c&&r[1]===first))add.push([c,first,q]);
  await writeDataset(dsName('pedmes',suc),{desde:keep.concat(add).map(r=>r[1]).sort()[0],hasta:months[months.length-1]},keep.concat(add));
  S.pedMes&&delete S.pedMes[suc];
}

function exportCsv(){saveCsv(stdKey(),new Date(),S.res.lines.filter(l=>finalOf(l)>0).sort((a,b)=>a.code.localeCompare(b.code)).map(l=>[l.code,finalOf(l)]))}
function exportSavedCsv(){const x=S.saved.find(s=>s.id===S.ui.openSaved);if(!x)return;let L=[];try{L=JSON.parse(x.lines)}catch(e){}saveCsv(x.sucursal,new Date(x.fecha),L.filter(r=>r[5]>0).map(r=>[r[0],r[5]]))}
function exportSug(){const L=S.res.lines.filter(l=>finalOf(l)>0||l.sug>0).sort((a,b)=>a.code.localeCompare(b.code));exportXlsx(`Pedido sugerido ${stdKey()} ${stamp()}.xlsx`,[{name:'Pedido',rows:sugSheet(L)},{name:'Todo el estandar',rows:sugSheet(S.res.lines.filter(l=>l.inStd))}])}
function exportInf(){const K=S.K,G=K.grupos,P=S.P;
  const res=[['Análisis de stock',stdKey()],['Stock al',S.D.stock&&S.D.stock.meta.fecha],[],['Grupo','$ stock','Partes','Unidades','MDI'],
    ...[['Estándar stock',G.std],['Con venta fuera del estándar',G.venta],['Sin venta en el período',G.sinventa]].map(([t,g])=>[t,r2(g.$),g.p,r2(g.u),g.dem$?r2(g.$/g.dem$):'']),['Total',r2(K.stock$),K.stockP,r2(K.stockU),K.dem$?r2(K.stock$/K.dem$):''],[],
    ['Demanda mensual $',r2(K.dem$)],['Estándar ideal $',r2(K.std.ideal$)],['Estándar actual $',r2(K.std.act$)],['Faltante al ideal $',r2(K.std.gap$)],...Object.keys(EST).map(k=>['Std '+EST[k][0],K.std[k]]),[],
    ['Parámetros'],['Ciclo de orden',P.oc],['Lead time normal',P.ltNormal],['Lead time DDP',P.ltDDP],['Stock de seguridad',P.ss],['Días hábiles',P.dias],[],['Ventas por mes'],...S.res.meses.map((m,i)=>[m,S.res.monthTotals[i]])];
  const inm=[['Código','Descripción','Stock','Cto. rep.','$ stock'],...S.res.lines.filter(l=>!l.q6&&l.st>0).sort((a,b)=>b.st*(b.cost||0)-a.st*(a.cost||0)).map(l=>[l.code,l.desc,l.st,l.cost,r2(l.st*(l.cost||0))])];
  exportXlsx(`Informe stock ${stdKey()} ${stamp()}.xlsx`,[{name:'Resumen',rows:res},{name:'Estandar',rows:stdSheet()},{name:'Pedido',rows:sugSheet(S.res.lines.filter(l=>finalOf(l)>0))},{name:'Sin venta',rows:inm}])}
function exportSaved(){const x=S.saved.find(s=>s.id===S.ui.openSaved);if(!x)return;let L=[];try{L=JSON.parse(x.lines)}catch(e){}
  exportXlsx(`${x.nombre}.xlsx`.replace(/[\\/:*?"<>|]/g,'-'),[{name:'Pedido',rows:[['Código','Descripción','Stock','Std stock','Sugerido','Pedido final','Cto. rep.','$ pedido','Order unit','BO','OD','En proceso','MAD'],...L.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r2(r[5]*(r[6]||0)),r[7],r[8],r[9],r[10],r[11]])]}])}

async function saveSug(name){
  if(!db){toast('El guardado no está disponible en esta vista.');return}
  const L=S.res.lines.filter(l=>finalOf(l)>0||l.sug>0).sort((a,b)=>a.code.localeCompare(b.code));
  if(!L.length){toast('No hay líneas para guardar.');return}
  const lines=L.map(l=>[l.code,l.desc,l.st,l.stdQty,l.sug,finalOf(l),l.cost,l.ou,l.bo,l.od,l.proc,r2(l.mad)]);
  const K=S.K.ped;
  try{await db.collection('sugeridos').add({nombre:name||'Pedido',fecha:new Date().toISOString(),sucursal:stdKey(),estado:'Borrador',usuario:ME()?ME().email:'',stockFecha:S.D.stock?S.D.stock.meta.fecha:null,params:S.P,resumen:{lineas:K.lineas,u:K.u,monto:r2(K.$)},lines:JSON.stringify(lines)});
    S.ui.saveOpen=false;logAct('Guardó pedido',`${name||'Pedido'} · ${K.lineas} líneas · ${f$(K.$)}`);toast('Sugerido guardado en el historial.');render()}catch(e){toast(e.code==='quota_exceeded'?'Se llenó el espacio: eliminá sugeridos viejos del historial.':'No se pudo guardar: '+(e.message||e.code))}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-view],[data-sort],[data-open],[data-addstd],[data-rmstd],[data-fybmode],[data-fybrm],[data-ctrl]');if(!t)return;
  const u=S.ui;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.view){u.view=t.dataset.view;u.sort=u.view==='pedir'?'$':'code';u.dir=u.view==='pedir'?-1:1;render();return}
  if(t.dataset.sort){const k=t.dataset.sort;if(u.sort===k)u.dir*=-1;else{u.sort=k;u.dir=['code','desc'].includes(k)?1:-1}render();return}
  if(t.dataset.open){u.openSaved=u.openSaved===t.dataset.open?null:t.dataset.open;u.confirmDel=null;render();return}
  if(t.dataset.fybmode){u.fybMode=t.dataset.fybmode;render();return}
  if(t.dataset.ctrl){u.ctrlOpen=u.ctrlOpen===t.dataset.ctrl?null:t.dataset.ctrl;u.ctrlDel=null;u.ctrlCloseAsk=null;render();const d=$('#ctrlDet');d&&u.ctrlOpen&&d.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(t.dataset.fybrm){const c=t.dataset.fybrm;saveFybItems(S.fyb.items.filter(x=>x[1]!==c)).then(()=>{logAct('Quitó de filtros y bujías',c,'Todas');render();toast(c+' quitada de la lista.')}).catch(e=>toast('No se pudo: '+(e.message||e.code)));return}
  if(t.dataset.addstd){logAct('Agregó al estándar',t.dataset.addstd);const k=stdKey();S.stdBy[k]=[...new Set([...(S.stdBy[k]||[]),t.dataset.addstd])];saveStd();recompute();render();return}
  if(t.dataset.rmstd){logAct('Quitó del estándar',t.dataset.rmstd);const k=stdKey();S.stdBy[k]=(S.stdBy[k]||[]).filter(c=>c!==t.dataset.rmstd);saveStd();recompute();render();toast(t.dataset.rmstd+' quitada del estándar');return}
  const a=t.dataset.act;
  if(a==='openSave'){u.saveOpen=true;render();const i=$('#saveName');i&&i.select();}
  else if(a==='closeSave'){u.saveOpen=false;render()}
  else if(a==='resetFin'){S.finals={};saveDraft();recompute();render()}
  else if(a==='exportSug')exportSug();
  else if(a==='exportCsv')exportCsv();
  else if(a==='logout'){window.__logout&&window.__logout()}
  else if(a==='backup'){dl&&dl.save({filename:`Respaldo Estandar Stock ${fDate(new Date())}.json`,data:window.__backup()}).then(()=>toast('Respaldo descargado.'))}
  else if(a==='exportSavedCsv')exportSavedCsv();
  else if(a==='exportStd')exportXlsx(`Estandar stock ${stdKey()} ${stamp()}.xlsx`,[{name:'Estandar',rows:stdSheet()}]);
  else if(a==='exportInf')exportInf();
  else if(a==='depoXls')depoXls();
  else if(a==='fybXls')fybXls();
  else if(a==='depoHist')depoHist();
  else if(a==='ctrlGen'){t.disabled=true;ctrlGen().finally(()=>{t.disabled=false})}
  else if(a==='ctrlPrint'){const c=ctrlSel();c&&ctrlPrint(c)}
  else if(a==='ctrlXls'){const c=ctrlSel();c&&ctrlXls(c)}
  else if(a==='ctrlHistXls')ctrlHistXls();
  else if(a==='ctrlSync'){const c=ctrlSel();if(!c)return;const st=ctrlStock();c.items.forEach(it=>{const x=st.get(it.c);it.s=x?x.q:0;if(x&&x.cost!=null)it.k=x.cost});c.stockFecha=S.D.stock?S.D.stock.meta.fecha:c.stockFecha;ctrlSave(c);render();toast('Stock del sistema actualizado al '+fD(c.stockFecha)+'.')}
  else if(a==='ctrlClose'||a==='ctrlCloseYes'){const c=ctrlSel();if(!c)return;const R=ctrlSum(c);if(a==='ctrlClose'&&R.cont<R.n){u.ctrlCloseAsk=c.id;render();return}
    const pend=c.items.filter(it=>it.q==null).length;c.items=c.items.filter(it=>it.q!=null);c.estado='Cerrado';c.cerradoAt=new Date().toISOString();c.cerradoPor=ME()?ME().email:'';u.ctrlCloseAsk=null;
    if(!c.items.length){db.doc('controles/'+c.id).delete();u.ctrlOpen=null;toast('No había nada contado: se eliminó el control.');return}
    ctrlSave(c).then(()=>render());const R2=ctrlSum(c);logAct('Cerró control de stock',`${R2.cont} piezas · exactitud ${fN(R2.exact,0)} % · faltante ${f$(R2.fal$)}`,c.suc);toast(`Control cerrado: exactitud ${fN(R2.exact,0)} %${pend?` (${pend} sin contar vuelven a salir)`:''}.`)}
  else if(a==='ctrlCloseNo'){u.ctrlCloseAsk=null;render()}
  else if(a==='ctrlReopen'){const c=ctrlSel();if(!c)return;c.estado='Abierto';delete c.cerradoAt;ctrlSave(c).then(()=>render())}
  else if(a==='ctrlDel'){const c=ctrlSel();if(c){u.ctrlDel=c.id;u.ctrlOpen=c.id;render()}}
  else if(a==='ctrlDelNo'){u.ctrlDel=null;render()}
  else if(a==='ctrlDelYes'){const id=u.ctrlDel;u.ctrlDel=null;u.ctrlOpen=null;db.doc('controles/'+id).delete().then(()=>{logAct('Eliminó control de stock',id);toast('Control eliminado.')}).catch(e=>toast('No se pudo eliminar: '+(e.message||e.code)))}
  else if(a==='exportSaved')exportSaved();
  else if(a==='askDel'){u.confirmDel=u.openSaved;render()}
  else if(a==='noDel'){u.confirmDel=null;render()}
  else if(a==='delSaved'){const id=u.confirmDel;u.confirmDel=null;u.openSaved=null;db&&db.doc('sugeridos/'+id).delete().then(()=>toast('Pedido eliminado.')).catch(e=>toast('No se pudo eliminar: '+(e.message||e.code)))}
  else if(a==='addAllCand'){const k=stdKey();const add=S.res.lines.filter(l=>l.cand).map(l=>l.code);logAct('Armó estándar con la regla',`${add.length} piezas`);S.stdBy[k]=[...new Set([...(S.stdBy[k]||[]),...add])];saveStd();recompute();render();toast(`${add.length} piezas agregadas al estándar.`)}
  else if(a==='cancelMap'){S.pending=null;render()}
  else if(a==='stMore'){const pu=S.pending.ui||(S.pending.ui={});pu.n=(pu.n||100)+400;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='stUndo'){const p=S.pending;for(const e of [...p.edits.values()].reverse()){const r=stRows(p.auto,e.suc)[e.i];stEdit(p,e.suc,e.i,'q',e.q0);stEdit(p,e.suc,e.i,'c',e.c0)}p.edits.clear();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='wingsBase'){(async()=>{try{const suc=S.P.sucursal;await deleteDataset(dsName('wings',suc));if(S.cache[suc])S.cache[suc].wings=null;S.D.wings=wingsFor(suc,S.cache[suc]||{});recompute();render();toast(S.D.wings?'Se usan otra vez los pedidos Wings del Excel base.':'Pedidos Wings borrados para '+suc+'.')}catch(e){toast('No se pudo: '+(e.message||e.code))}})()}
  else if(a==='copyStd'){const from=t.dataset.from;logAct('Copió estándar',`desde ${from}`);S.stdBy[stdKey()]=[...(S.stdBy[from]||[])];saveStd();recompute();render();toast(`Se copiaron ${S.stdBy[stdKey()].length} piezas del estándar de ${from}.`)}
  else if(a==='rmSuc'){const s=t.dataset.suc;if(S.sucs.length<2)return;S.sucs=S.sucs.filter(x=>x!==s);saveSucs();if(S.P.sucursal===s)switchSuc(S.sucs[0]);else render()}
  else if(a==='confirmMap')confirmMap();
  else if(a==='resetParams'){S.P=Object.assign({},DEFAULT_PARAMS,{sucursal:S.P.sucursal});saveParams();recompute();render()}
});
let qT;
document.addEventListener('input',e=>{
  const t=e.target,u=S.ui;
  if(t.id==='stQ'&&S.pending){const pu=S.pending.ui||(S.pending.ui={});pu.q=t.value;pu.n=100;clearTimeout(qT);qT=setTimeout(()=>{const pos=t.selectionStart,y=window.scrollY;render();window.scrollTo(0,y);const n=$('#stQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250);return}
  if(t.id==='fybQ'){u.fybQ=t.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('#fybQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250);return}
  if(t.id==='q'||t.id==='stdQ'||t.id==='candQ'){u[t.id]=t.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250);return}
  if(t.dataset.fin){const l=S.byCode.get(t.dataset.fin);let v=Math.max(0,num(t.value));if(v===l.sug)delete S.finals[l.code];else S.finals[l.code]=v;t.classList.toggle('chg',S.finals[l.code]!=null);
    const c=document.querySelector(`[data-tot="${CSS.escape(l.code)}"]`);if(c)c.textContent=v?f$(v*(l.cost||0)):'';updateTotals();saveDraft();return}
  if(t.dataset.p){const v=num(t.value);S.P[t.dataset.p]=v;saveParams();recompute();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.st){e.preventDefault();e.target.blur()}});
document.addEventListener('change',e=>{
  const t=e.target,u=S.ui;
  if(t.id==='restoreFile'){const f=t.files[0];t.value='';if(!f)return;f.text().then(window.__restore).then(()=>{toast('Respaldo restaurado. Recargando…');setTimeout(()=>location.reload(),800)}).catch(e=>toast('No se pudo restaurar: '+e.message));return}
  if(t.dataset.file==='fyb'){const f=t.files[0];t.value='';if(f)importFyb(f).catch(err=>toast('No se pudo importar: '+err.message));return}
  if(t.dataset.file){const f=t.files[0];t.value='';if(f)readFile(t.dataset.file,f).catch(err=>toast('No se pudo leer el archivo: '+err.message));return}
  if(t.id==='sucSel'){if(t.value==='__add'){t.value=S.P.sucursal;S.tab='params';render();setTimeout(()=>{const i=$('#newSuc');i&&(i.scrollIntoView({block:'center'}),i.focus())},50);return}switchSuc(t.value);return}
  if(t.id==='origSel'){S.P.origen=t.value;saveParams();recompute();render();toast(t.value?`Mostrando solo origen ${t.value==='N'?'N · Original':'P · Nacional'}`:'Mostrando todos los orígenes');return}
  if(t.id==='actSuc'||t.id==='actUser'){S.ui[t.id]=t.value;render();return}
  if(t.id==='fam'){u.fam=t.value;render();return}
  if(t.id==='stdEst'){u.stdEst=t.value;render();return}
  if(t.id==='mapSheet'){setSheet(t.value);return}
  if(t.id==='mapHdr'){S.pending.h=Math.max(0,num(t.value)-1);autoMap();render();return}
  if(t.dataset.map){S.pending.map[t.dataset.map]=+t.value;render();return}
  if(t.dataset.msuc!=null){S.pending.auto.multi[+t.dataset.msuc].sucApp=t.value;return}
  if(t.dataset.st&&S.pending&&S.pending.auto){const p=S.pending,[i,f]=t.dataset.st.split(':'),sucs=stSucs(p.auto),suc=sucs.includes((p.ui||{}).suc)?p.ui.suc:sucs[0];const raw=String(t.value).trim();
    stEdit(p,suc,+i,f,f==='c'&&raw===''?null:num(raw));const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.id==='stSuc'&&S.pending){(S.pending.ui||(S.pending.ui={})).suc=t.value;S.pending.ui.n=100;render();return}
  if(t.id==='depMet'){S.ui.depMet=t.value;render();return}
  if(t.id==='ctrlCr'){u.ctrlCr=t.value;render();return}
  if(t.id==='ctrlN'||t.id==='ctrlTop'){const c=ctrlCfg(),v=Math.round(num(t.value));if(t.id==='ctrlN')c.n=Math.min(200,Math.max(1,v||15));else c.top=Math.min(5000,Math.max(10,v||100));saveCtrlCfg();render();return}
  if(t.dataset.cnt!=null||t.dataset.cnota!=null){const c=ctrlSel();if(!c||c.estado==='Cerrado')return;
    if(t.dataset.cnota!=null){c.items[+t.dataset.cnota].nt=t.value.trim();ctrlSave(c);return}
    const i=+t.dataset.cnt,it=c.items[i];it.q=t.value===''?null:Math.max(0,num(t.value));t.classList.toggle('chg',it.q!=null);
    const cell=document.querySelector(`[data-cdif="${i}"]`);if(cell)cell.innerHTML=ctrlDifCell(it);const sm=$('#ctrlSum');if(sm)sm.innerHTML=ctrlSumHtml(c);ctrlSave(c);return}
  if(t.id==='fybSuc'||t.id==='fybDesde'){S.ui[t.id]=t.value;render();return}
  if(t.dataset.pc){S.P[t.dataset.pc]=t.checked;saveParams();recompute();return}
  if(t.dataset.transf){const k=t.dataset.transf;S.sucCfg[k]=Object.assign({},S.sucCfg[k],{transf:t.checked});saveSucs();recompute();render();return}
  if(t.dataset.fam){const s=new Set(S.P.exclFam||[]);t.checked?s.add(t.dataset.fam):s.delete(t.dataset.fam);S.P.exclFam=[...s];saveParams();recompute();return}
  if(t.dataset.p){render();return}
  if(t.id==='estSel'){const sv=S.saved.find(x=>x.id===t.dataset.id);logAct('Cambió estado de pedido',`${sv?sv.nombre:''} → ${t.value}`,sv&&sv.sucursal);db&&db.doc('sugeridos/'+t.dataset.id).update({estado:t.value}).catch(e=>toast('No se pudo actualizar: '+(e.message||e.code)));return}
});
document.addEventListener('keydown',e=>{
  const t=e.target;if(e.key!=='Enter'||!t.dataset||t.dataset.cnt==null)return;e.preventDefault();
  const n=document.querySelector(`[data-cnt="${+t.dataset.cnt+1}"]`);if(n){n.focus();n.select()}else t.blur();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='saveForm'){saveSug($('#saveName').value.trim())}
  if(e.target.dataset&&e.target.dataset.man){saveManual(e.target.dataset.man,e.target);return}
  if(e.target.id==='addSuc'){const n=$('#newSuc').value.trim();if(!n)return;if(S.sucs.some(s=>slug(s)===slug(n))){toast('Esa sucursal ya existe.');return}S.sucs.push(n);saveSucs();switchSuc(n);toast(n+' agregada. Cargá sus ventas y stock en Cargar datos.')}
  if(e.target.id==='fybAdd'){const c=norm($('#fybCode').value);if(!c||!S.fyb)return;if(S.fyb.items.some(x=>fkey(x[1])===fkey(c))){toast('Esa pieza ya está en la lista.');return}const l=S.byCode&&S.byCode.get(c);
    saveFybItems(S.fyb.items.concat([[$('#fybCat').value,c,l?l.desc:'',$('#fybApl').value.trim()]])).then(()=>{logAct('Agregó a filtros y bujías',c,'Todas');render();toast(c+' agregada.')}).catch(err=>toast('No se pudo: '+(err.message||err.code)));return}
  if(e.target.id==='addStd'){const c=norm($('#addCode').value);if(!c)return;logAct('Agregó al estándar',c);const k=stdKey();S.stdBy[k]=[...new Set([...(S.stdBy[k]||[]),c])];saveStd();recompute();render();toast(c+' agregada al estándar'+(S.byCode.get(c)&&S.byCode.get(c).enStock?'':' (no figura en stock ni ventas)'))}
});
boot();
</script>
