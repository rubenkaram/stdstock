<style>

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

main{padding-top:20px;display:grid;gap:18px}

.sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:80ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}

.tile{background:var(--surface);padding:12px 14px;min-width:0}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=search],input[type=date],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{appearance:none;font:600 13px var(--f-body);border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface2)}

th.s{cursor:pointer}th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.code{font-family:var(--f-mono);font-size:12px}
td.desc{max-width:280px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:var(--surface2)}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:600}
td.hl{background:var(--accent-soft)!important;font-weight:600}
tr.trf td{background:var(--warn-soft)}tr.trf td.code{box-shadow:inset 3px 0 0 var(--warn)}
td input.fin{width:66px;text-align:right;padding:3px 6px;font-variant-numeric:tabular-nums}
td input.fin.chg{border-color:var(--accent);background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bajo{background:var(--warn-soft);color:var(--warn)}.p-quiebre{background:var(--crit-soft);color:var(--crit)}.p-exceso{background:var(--info-soft);color:var(--info)}.p-sin{background:var(--surface2);color:var(--muted)}

.muted{color:var(--muted)}.faint{color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.card .st{font-size:12.5px;color:var(--muted)}
.card label.file{justify-self:start}
.req{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.opt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.map label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.bars{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden}
.bars span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

.chart svg{display:block;width:100%;height:auto}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}

.params label small{color:var(--faint)}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:hover{background:var(--surface2)}
.list-row.sel{background:var(--accent-soft)}

.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
@media (max-width:640px){.tile .v{font-size:19px}.brand h1{font-size:19px}header.top{position:static}.chip{white-space:normal}.toprow{padding-block:10px}}

/* Percent Fill */
.pf-load{display:grid;gap:14px}
.pf-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start}
.pf-f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.pf-f .faint{font-weight:400;font-size:11.5px}
.pf-f input[type=number]{font:600 17px var(--f-mono);width:190px;max-width:100%}
input[type=month]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.pf-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.pf-drop{position:relative;display:grid;gap:6px;align-content:start;border:2px dashed var(--line);border-radius:10px;background:var(--surface2);padding:14px;min-height:130px;cursor:pointer;transition:border-color .15s,background .15s}
.pf-drop:hover,.pf-drop:focus-within{border-color:var(--accent)}
.pf-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.pf-drop.ok{border-style:solid;border-color:var(--ok)}
.pf-drop.err{border-style:solid;border-color:var(--crit)}
.pf-t{font-weight:700;font-size:14.5px}
.pf-file{font:12px var(--f-mono);word-break:break-all}
.pf-msg{font-size:12.5px;color:var(--ok)}.pf-msg.e{color:var(--crit)}
.pf-chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.pf-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.pf-card{display:grid;gap:8px;align-content:start}
.pf-big{font:600 40px/1 var(--f-display);color:var(--ok);font-variant-numeric:tabular-nums}
.pf-big small{font-size:20px}
.pf-bar{height:8px;border-radius:2px;background:var(--warn);overflow:hidden}.pf-bar i{display:block;height:100%;background:var(--ok)}
.pf-fill{font-size:13px}.pf-fill b{color:var(--warn);font-variant-numeric:tabular-nums}
.pf-dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:4px 0 0;font-size:12.5px}
.pf-dl dt{color:var(--muted)}.pf-dl dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pf-dl .tot{border-top:1px solid var(--line);padding-top:3px;color:var(--ink);font-weight:600}
.pf-views{justify-content:space-between;margin-bottom:-4px}
.vp-badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
.vp-banner{appearance:none;border:1px solid var(--crit);background:var(--crit-soft);color:var(--ink);border-radius:7px;padding:6px 12px;font:600 12.5px var(--f-body);cursor:pointer}
.vp-alert{border-color:var(--crit)}.vp-alert h3{color:var(--crit)}
.vp-filt label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.vp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.vp-grid .vp-wide{grid-column:1/-1}
.vp-sucs{display:grid;gap:4px}.vp-suc{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.pf-dropwide{display:grid;gap:4px;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:10px;background:var(--surface2);padding:28px 14px;margin-top:6px}
.pf-dropwide.over,label.btn.over{border-color:var(--accent);background:var(--accent-soft)}
tr.pf-total td{background:var(--surface2);border-top:2px solid var(--line)}
tr.pf-tr{cursor:pointer}tr.pf-tr:hover td{background:var(--surface2)}tr.pf-tr.sel td{background:var(--accent-soft)}
</style>

<style>

/* ---------- parsing ---------- */
function parseDate(v){
  if(v==null)return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());}
  const s=String(v).trim(); if(!s)return null;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  return null;
}

  const miss=["fp","np","tp","pp","qf","es","vt"].filter(k=>C[k]<0);

    const eRaw=txt(g(r,"es")); const ec=parseInt(eRaw);
    const est=(ec===70||ec===86)?"facturado":ec===95?"cancelado":"pendiente";
    rows.push({fp,np:txt(g(r,"np")),tipo,item:txt(g(r,"it")),pp:code(g(r,"pp")),pf:code(g(r,"pf"))||code(g(r,"pp")),qp:num(g(r,"qp")),qf:num(g(r,"qf")),
      eRaw,ec,est,caja:txt(g(r,"cj")),nf:txt(g(r,"nf")),ff:parseDate(g(r,"ff")),pu:num(g(r,"pu")),de:txt(g(r,"de")),co:txt(g(r,"co")),vt:num(g(r,"vt")),vin:txt(g(r,"vin"))});
  }

  state.mes="all";$("mes").value="all";state.open.clear();
  buildChips();render();renderCode();
}

/* ---------- aggregation ---------- */
function filtered(withMonth=true){return ROWS.filter(r=>state.tipos.has(r.tipo)&&(!withMonth||state.mes==="all"||r.mk===state.mes))}

function summarize(rs){

  }

}
function ordersOf(rs){

  for(const r of rs){let o=m.get(r.np);if(!o){o={np:r.np,fp:r.fp,tipo:r.tipo,rows:[],lines:new Set(),cods:new Set(),u:0,uf:0,imp:0,impF:0,est:new Set(),facts:new Set(),co:new Set(),vin:new Set()};m.set(r.np,o)}
    o.rows.push(r);o.lines.add(lineKey(r));o.cods.add(r.pp);o.u+=r.qf;o.imp+=r.vt;o.est.add(r.est);if(r.est==="facturado"){o.uf+=r.qf;o.impF+=r.vt;if(r.nf)o.facts.add(r.nf)}if(r.co)o.co.add(r.co);if(r.vin)o.vin.add(r.vin)}

}

/* ---------- Demora de facturación ---------- */
// una entrada por línea (pedido + ítem + código) y factura; Wings repite la línea por caja
function leadLines(rs){
  const m=new Map();
  for(const r of rs){if(r.est!=="facturado"||r.lead==null)continue;const k=lineKey(r)+"|"+r.nf;let o=m.get(k);
    if(!o){o={pp:r.pp,pf:r.pf,np:r.np,tipo:r.tipo,fp:r.fp,ff:r.ff,nf:r.nf,lead:r.lead,ddp:isDDP(r),u:0};m.set(k,o)}o.u+=r.qf}
  return [...m.values()];
}
// piezas DDP (las pasa la app; se comparan sin barras ni espacios, por código pedido o facturado)
let DDP=new Set();
const dkey=v=>String(v??"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const isDDP=r=>DDP.has(dkey(r.pp))||DDP.has(dkey(r.pf));
const LLEGA=2; // llegada probable = fecha de factura + 2 días
const addD=(d,n)=>d?new Date(d.getFullYear(),d.getMonth(),d.getDate()+n):null;
// promedios pedido -> factura y pedido -> llegada probable: DDP, otras y todas
// período de los promedios: últimos N meses completos por mes de factura (el mes en curso no entra)
state.ldWin=3;
const fmk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const curMk=()=>fmk(new Date());
function winMonths(L){
  const ms=[...new Set(L.map(x=>fmk(x.ff)))].filter(m=>m<curMk()).sort();
  return state.ldWin?ms.slice(-state.ldWin):ms;
}
function winLines(L){const ms=new Set(winMonths(L));return L.filter(x=>ms.has(fmk(x.ff)))}
function winTxt(L){const ms=winMonths(L);return ms.length?(ms.length===1?mesLbl(ms[0]):mesLbl(ms[0])+" a "+mesLbl(ms.at(-1))):"sin meses completos facturados"}
function renderLdEv(L){

  const cD=css("--s2"),cO=css("--s1");
  $("lgEv").innerHTML=`<span><i style="background:${cD}"></i>Piezas DDP</span><span><i style="background:${cO}"></i>Otras (no DDP)</span>`;
  const shade={id:"shadeWin",beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;const idx=ms.map((m,i)=>win.has(m)?i:-1).filter(i=>i>=0);if(!idx.length||!a)return;
    const w=ms.length>1?(x.getPixelForValue(1)-x.getPixelForValue(0)):a.width;const x0=Math.max(a.left,x.getPixelForValue(idx[0])-w/2),x1=Math.min(a.right,x.getPixelForValue(idx.at(-1))+w/2);

      scales:{...baseOpts().scales,y:{...baseOpts().scales.y,title:{display:true,text:"días",color:css("--muted"),font:{family:"IBM Plex Sans",size:11}}}}})});
}
const WINS=[[1,"1 mes"],[2,"2 meses"],[3,"3 meses"],[4,"4 meses"],[0,"Todo"]];

function ddpStats(L){
  const g=f=>{const a=L.filter(f),v=a.map(x=>x.lead);return {n:a.length,u:a.reduce((s,x)=>s+x.u,0),prom:avg(v),med:median(v),sum:v.reduce((s,x)=>s+x,0)}};

}
// L = líneas generales (todas las piezas); pz = {t: nombre, L: líneas de la pieza buscada} opcional
function ddpHTML(L,titulo,pz){

    ${p&&p.n?`<div class="pz"><b>${pz.t}</b>: pedido → factura <b>${pl(p.prom)}</b> · llegada probable <b>${pa(p.prom)}</b> <span class="ds">(${fmtN(p.n)} línea${p.n===1?"":"s"})</span></div>`:""}</div>`;

  <div class="ddpg">${box("Piezas DDP",S.ddp,P&&P.ddp,"--s2")}${box("Otras piezas (no DDP)",S.otr,P&&P.otr,"--s1")}</div>`;

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
const fD1=x=>x==null?"—":x.toLocaleString("es-AR",{maximumFractionDigits:1});
function leadPieces(L){
  const m=new Map();
  for(const x of L){let o=m.get(x.pp);if(!o){o={c:x.pp,ddp:x.ddp,v:[],u:0,uw:0,min:x.lead,max:x.lead,last:x,tipos:new Set(),peds:new Set()};m.set(x.pp,o)}
    o.v.push(x.lead);o.u+=x.u;o.uw+=x.lead*x.u;o.min=Math.min(o.min,x.lead);o.max=Math.max(o.max,x.lead);o.tipos.add(x.tipo);o.peds.add(x.np);
    if((x.ff||x.fp)>(o.last.ff||o.last.fp))o.last=x}
  return [...m.values()].map(o=>Object.assign(o,{n:o.v.length,prom:avg(o.v),lleg:avg(o.v)+LLEGA,med:median(o.v)}));
}

const ckey=v=>String(v??"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function codeLines(q){
  const k=ckey(q);if(k.length<3)return null;
  const ex=ROWS.filter(r=>ckey(r.pp)===k||ckey(r.pf)===k);
  if(ex.length)return {exact:true,rows:ex,codes:[...new Set(ex.map(r=>r.pp))]};
  const pa=ROWS.filter(r=>ckey(r.pp).includes(k)||ckey(r.pf).includes(k));
  return {exact:false,rows:pa,codes:[...new Set(pa.map(r=>r.pp))]};
}

    sec.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{$("cq").value=b.dataset.c;renderCode()});return}

  <div class="tw"><table><thead><tr><th>Fecha pedido</th><th>N° pedido</th><th>Ítem</th><th>Tipo</th><th>Código</th><th class="r">Unid.</th><th>Situación</th><th>Estado Ford</th><th class="r">Días</th><th>Factura</th><th>Fecha fact.</th><th title="Fecha de factura + 2 días">Llegada prob.</th><th>Caja</th><th class="r">Importe</th><th>Comentario</th></tr></thead><tbody>${

  for(const r of ROWS){const k=lineKey(r);let o=lm.get(k);if(!o){o={ped:0,lleg:0};lm.set(k,o)}o.ped+=r.qf;if(r.est==="facturado"){o.lleg+=r.qf;if(!fb.has(r.pf))fb.set(r.pf,[]);fb.get(r.pf).push(r)}
    if(r.est==="pendiente"){if(!pend.has(r.pp))pend.set(r.pp,new Set());pend.get(r.pp).add(r.np)}}

    const L=lm.get(lineKey(r))||{ped:r.qf,lleg:0};const obs=[],obsT=[];

async function runExport(btn,kind){
  if(!ROWS.length)return;
  const need=kind==="pdf"?(window.jspdf&&window.jspdf.jsPDF&&window.Chart):(window.ExcelJS&&window.Chart);
  if(!need){toast("No se pudieron cargar las herramientas del informe. Revisá la conexión y recargá la página.");return}
  const lbl=btn.innerHTML;btn.disabled=true;btn.lastChild.textContent=" Generando…";
  try{
    await new Promise(r=>setTimeout(r,30));
    const base="Informe pedidos repuestos "+(state.mes==="all"?"":mesL(state.mes)+" ")+stamp();
    if(kind==="pdf")await saveFile(base+".pdf",await makePDF());
    else await saveFile(base+".xlsx",await makeXLSX());
  }catch(e){console.error(e);toast("No se pudo generar el informe: "+(e.message||e))}
  finally{btn.disabled=false;btn.innerHTML=lbl}
}
$("btnPdf").onclick=e=>runExport(e.currentTarget,"pdf");
$("btnXls").onclick=e=>runExport(e.currentTarget,"xls");

function boReportData(){

  const ageTot=BO_BUCKETS.map(b=>sum(rows.filter(r=>r.dias>=b[0]&&r.dias<=b[1])));

<script>/* Adaptador Supabase: guarda los datos de la app en la tabla "docs" y los archivos exportados en el bucket "archivos" */
window.__LOCAL = true; // habilita Respaldo en Parámetros
(function () {

      document.body.appendChild(el); };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);

  }
  if (!cfg) {
    const show = () => { const el = document.createElement('div'); el.id = 'setup';
      el.style.cssText = 'position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);padding:16px';
      el.innerHTML = `<form style="width:min(460px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;font-size:14px"><b style="font-size:17px">Conectar con Supabase</b><div class="sub" style="margin:0">Se hace una sola vez en cada computadora. Los datos están en Supabase, en el botón <b>Connect</b> del proyecto (o Project Settings &gt; API Keys).</div><label style="display:grid;gap:4px;color:var(--muted);font-size:13px">Project URL<input type="text" id="suUrl" placeholder="https://abcdefgh.supabase.co"></label><label style="display:grid;gap:4px;color:var(--muted);font-size:13px">Publishable key<input type="text" id="suKey" placeholder="sb_publishable_..."></label><div id="suMsg" style="color:var(--crit);font-size:13px;min-height:1em"></div><button class="btn pri" type="submit">Guardar y conectar</button></form>`;
      document.body.appendChild(el);
      el.querySelector('form').addEventListener('submit', e => { e.preventDefault(); e.stopPropagation();
        const c = { SUPABASE_URL: document.getElementById('suUrl').value.trim().replace(/\/+$/, ''), SUPABASE_ANON_KEY: document.getElementById('suKey').value.trim() };
        if (!valid(c)) { document.getElementById('suMsg').textContent = /sb_secret_/.test(c.SUPABASE_ANON_KEY) ? 'Esa es la Secret key: usá la Publishable key.' : 'Revisá: la URL termina en .supabase.co y la clave empieza con sb_publishable_'; return; }
        localStorage.setItem('stdstock-supabase', JSON.stringify(c)); location.reload(); }, true);
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
    window.claude = { use: () => new Promise(() => {}) };
    return;
  }
  if (!window.supabase || !window.supabase.createClient) { fatal('No se pudo descargar la librería de Supabase. Revisá la conexión a internet y recargá con Ctrl+F5.'); return; }
  let sb; try { sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); } catch (e) { fatal('Supabase rechazó la configuración: ' + e.message); return; }
  const mem = new Map(); const listeners = {};
  const err = e => ({ code: 'unavailable', message: (e && e.message) || String(e) });
  const notify = p => { const col = p.split('/').slice(0, -1).join('/'); (listeners[col] || []).forEach(f => f()); };
  async function put(path, data) {
    const v = JSON.parse(JSON.stringify(data)); mem.set(path, v);
    const { error } = await sb.from('docs').upsert({ path, data: v, updated_at: new Date().toISOString() });
    if (error) throw err(error); notify(path);
  }
  async function del(path) {
    mem.delete(path); const { error } = await sb.from('docs').delete().eq('path', path);
    if (error) throw err(error); notify(path);
  }
  const snap = p => { const d = mem.get(p); return { id: p.split('/').pop(), exists: d !== undefined, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docRef = p => ({ id: p.split('/').pop(), path: p, get: async () => snap(p), set: d => put(p, d), delete: () => del(p),
    update: async d => { const cur = mem.get(p); if (cur === undefined) throw { code: 'invalid_argument', message: 'no existe' }; await put(p, Object.assign({}, cur, d)); },
    collection: c => colRef(p + '/' + c) });
  function colRef(c) {
    const docsOf = () => [...mem.keys()].filter(k => k.startsWith(c + '/') && k.slice(c.length + 1).indexOf('/') < 0).sort().map(snap);
    return { path: c, doc: id => docRef(c + '/' + (id || newId())),
      add: async d => { const r = docRef(c + '/' + newId()); await r.set(d); return r; },
      get: async () => { const docs = docsOf(); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot: next => { const f = () => { const docs = docsOf(); next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }); };
        (listeners[c] || (listeners[c] = [])).push(f); setTimeout(f, 0); return () => { listeners[c] = listeners[c].filter(x => x !== f); }; } };
  }
  async function loadAll() {
    mem.clear(); let from = 0; const step = 200;
    for (;;) {
      const { data, error } = await sb.from('docs').select('path,data').order('path').range(from, from + step - 1);
      if (error) throw err(error);
      data.forEach(r => mem.set(r.path, r.data)); if (data.length < step) break; from += step;
    }
  }
  const stamp = () => new Date().toISOString().slice(0, 7);
  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    const safe = filename.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\- ]+/g, '-');
    const { error } = await sb.storage.from('archivos').upload(`exportados/${stamp()}/${safe}`, blob, { upsert: true });
    if (error) console.warn('No se pudo subir a Supabase Storage', error);
    return { status: 'saved' };
  } };
  window.__backup = () => JSON.stringify(Object.fromEntries(mem));
  function panel(html) {
    let el = document.getElementById('restoreBox');
    if (!el) { el = document.createElement('div'); el.id = 'restoreBox';
      el.style.cssText = 'position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px';
      document.body.appendChild(el); }
    el.innerHTML = `<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(440px,100%);display:grid;gap:10px;font-size:14px">${html}</div>`;
    return el;
  }
  window.__restore = async json => {
    let o; try { o = JSON.parse(json); } catch (e) { throw new Error('el archivo no es un respaldo válido'); }
    if (!o['config/params']) throw new Error('no es un respaldo de esta app');
    const entries = Object.entries(o); const fails = [];
    panel(`<b>Restaurando respaldo…</b><div id="rsMsg">Borrando datos anteriores</div>`);
    const { error: e1 } = await sb.from('docs').delete().neq('path', '');
    if (e1) { panel(`<b>No se pudo restaurar</b><div>Supabase no dejó borrar los datos anteriores: ${e1.message}</div><button class="btn" onclick="this.closest('#restoreBox').remove()">Cerrar</button>`); throw new Error(e1.message); }
    for (let i = 0; i < entries.length; i++) {
      const [path, data] = entries[i];
      const m = document.getElementById('rsMsg'); if (m) m.textContent = `Subiendo ${i + 1} de ${entries.length}: ${path}`;
      let ok = false, last = null;
      for (let t = 0; t < 3 && !ok; t++) { const { error } = await sb.from('docs').upsert({ path, data, updated_at: new Date().toISOString() }); if (error) { last = error; await new Promise(r => setTimeout(r, 800)); } else ok = true; }
      if (!ok) fails.push(`${path}: ${last && last.message}`);
    }
    const { count, error: e2 } = await sb.from('docs').select('path', { count: 'exact', head: true });
    const got = e2 ? '?' : count;
    if (fails.length || got !== entries.length) {
      panel(`<b>La restauración quedó incompleta</b><div>Se guardaron ${got} de ${entries.length} registros.</div>${fails.length ? `<pre style="white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto">${fails.join('\n').replace(/</g, '&lt;')}</pre>` : ''}<div>Sacá una captura de este mensaje para revisarlo.</div><button class="btn" onclick="location.reload()">Cerrar y recargar</button>`);
      throw new Error('restauración incompleta');
    }
    panel(`<b>Respaldo restaurado</b><div>Se guardaron ${got} registros en Supabase. La página se va a recargar.</div>`);
  };

  /* Pantalla de ingreso */
  let resolveReady; const ready = new Promise(r => resolveReady = r);
  const css = `#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:16px}#login form{width:min(360px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}#login h2{margin:0}#login label{display:grid;gap:4px;font-size:13px;color:var(--muted)}#login .msg{color:var(--crit);font-size:13px;min-height:1em}#logout{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}`;
  function showLogin(msg) {
    let el = document.getElementById('login');
    if (!el) { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
      el = document.createElement('div'); el.id = 'login';
      el.innerHTML = `<form><h2>Estándar Stock</h2><p class="sub" style="margin:0">Ingresá con tu usuario de Karam.</p><label>Email<input type="text" id="lgEmail" autocomplete="username"></label><label>Contraseña<input type="password" id="lgPass" autocomplete="current-password"></label><div class="msg" id="lgMsg"></div><button class="btn pri" type="submit">Ingresar</button></form>`;
      document.body.appendChild(el);
      el.querySelector('form').addEventListener('submit', async e => { e.preventDefault(); e.stopPropagation();
        document.getElementById('lgMsg').textContent = 'Ingresando…';
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('lgEmail').value.trim(), password: document.getElementById('lgPass').value });
        if (error) { document.getElementById('lgMsg').textContent = /invalid login|credentials/i.test(error.message) ? 'Email o contraseña incorrectos.' : 'No se pudo ingresar: ' + error.message; return; }
        start(); }, true);
    }
    document.getElementById('lgMsg').textContent = msg || '';
  }
  async function start() {
    const { data: ses } = await sb.auth.getSession();
    const email = ses && ses.session && ses.session.user && ses.session.user.email;
    if (!email) { showLogin(); return; }
    const { data: urows, error: ue } = await sb.from('usuarios').select('*').ilike('email', email);
    if (ue) { showLogin('No se pudieron leer los permisos: ' + ue.message); return; }
    const u = urows && urows[0];
    const sucs = u ? (Array.isArray(u.sucursales) && u.sucursales.length ? u.sucursales : (u.sucursal ? [u.sucursal] : [])) : [];
    if (!u) { await sb.auth.signOut(); showLogin(`El usuario ${email} no está habilitado. Pedile al administrador que lo agregue en Usuarios.`); return; }
    if (u.activo === false) { await sb.auth.signOut(); showLogin(`El usuario ${email} está desactivado. Hablá con el administrador.`); return; }
    if (!u.admin && !sucs.length) { await sb.auth.signOut(); showLogin(`El usuario ${email} no tiene una sucursal asignada. Pedile al administrador que se la asigne en Usuarios.`); return; }
    window.__USER = { email: email.toLowerCase(), nombre: u.nombre || '', sucursal: sucs[0] || '', sucursales: sucs, permisos: Array.isArray(u.permisos) ? u.permisos : null, admin: !!u.admin };
    try { await loadAll(); } catch (e) { showLogin('No se pudieron leer los datos: ' + e.message); return; }
    const el = document.getElementById('login'); if (el) el.remove();
    resolveReady();
  }
  /* Administración de usuarios: solo el administrador (lo controla también Supabase) */
  const rpcErr = e => { const m = (e && e.message) || String(e); return new Error(/could not find the function|schema cache/i.test(m) ? 'Falta correr supabase/usuarios.sql en Supabase (SQL Editor).' : m); };
  window.__adm = {
    list: async () => { const { data, error } = await sb.from('usuarios').select('*').order('email'); if (error) throw rpcErr(error); return data || []; },
    guardar: async o => { const { error } = await sb.rpc('admin_guardar_usuario', { p_email: o.email, p_nombre: o.nombre || null, p_sucursales: o.sucursales, p_permisos: o.permisos, p_activo: o.activo !== false, p_clave: o.clave || null }); if (error) throw rpcErr(error); },

  };
  window.__logout = async () => { await sb.auth.signOut(); try { localStorage.removeItem('stdstock-suc'); } catch (e) {} location.reload(); };
  sb.auth.getSession().then(({ data }) => { if (data.session) start(); else showLogin(); });
  window.claude = { use: async n => { await ready; return n === 'db' ? { doc: docRef, collection: colRef } : n === 'downloads' ? downloads : null; } };
})();

<script>
/* ===== Núcleo de cálculo (réplica de la lógica del Excel PEDIDO SUGERIDO) ===== */
const norm = s => String(s == null ? '' : s).replace(/\s+/g, '').toUpperCase();
const num = v => { if (v == null || v === '') return 0; if (typeof v === 'number') return v; const t = String(v).trim().replace(/\s/g, ''); const n = Number(/,\d{1,2}$/.test(t) ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '')); return isFinite(n) ? n : 0; };
const OIL_DEFAULT = ['Lubricantes y químicos'];

    let mi = meses.indexOf(mes); if (mi < 0) { meses.push(mes); mi = meses.length - 1; }

function needData(){

function sugRows(){

    if(u.view==='transf'&&!(l.transf>0))return false;
    if(u.fam&&l.fam!==u.fam)return false;
    if(q&&!(l.code.includes(q)||l.desc.toUpperCase().includes(q)))return false;
    return true});
  const key={code:l=>l.code,desc:l=>l.desc,q6:l=>l.q6,mad:l=>l.mad,std:l=>l.stdQty,st:l=>l.st,dif:l=>l.dif,sug:l=>l.sug,fin:l=>finalOf(l),'$':l=>finalOf(l)*(l.cost||0),cost:l=>l.cost||0}[u.sort]||(l=>l.code);

const FYB_MODE={ped:'Pedido a Ford',excel:'Solo el Excel',sug:'Sugerido guardado',cmp:'Pedido vs sugerido'};
function fybMatrix(){
  const F=S.fyb,u=S.ui,sucs=u.fybSuc?[u.fybSuc]:S.sucs;const items=F.items;const keys=new Set(items.map(x=>fkey(x[1])));
  const add=(m,k,mo,q)=>{const o=m.get(k)||{};o[mo]=(o[mo]||0)+q;m.set(k,o)};
  const ex=new Map(),wg=new Map(),sg=new Map(),cover={},months=new Set();
  for(const [c,mo,su,q] of F.hist)if(sucs.includes(su)){add(ex,fkey(c),mo,q);months.add(mo)}
  for(const su of sucs){const d=F.pm[su];if(!d)continue;cover[su]=[d.meta.desde,d.meta.hasta];for(const [c,mo,q] of d.rows){const k=fkey(c);if(keys.has(k)){add(wg,k,mo,q)}months.add(mo)}}
  for(const x of S.saved){if(!sucs.includes(x.sucursal))continue;const mo=String(x.fecha).slice(0,7);let L=[];try{L=JSON.parse(x.lines||'[]')}catch(e){}
    for(const r of L){const k=fkey(r[0]);if(keys.has(k)&&r[5]>0){add(sg,k,mo,r[5]);months.add(mo)}}}
  const covered=mo=>sucs.length&&sucs.every(su=>cover[su]&&mo>=cover[su][0].slice(0,7)&&mo<=cover[su][1].slice(0,7));
  const partly=mo=>sucs.some(su=>cover[su]&&mo>=cover[su][0].slice(0,7)&&mo<=cover[su][1].slice(0,7));
  const ped=(k,mo)=>{let t=0;for(const su of sucs){const c=cover[su];if(c&&mo>=c[0].slice(0,7)&&mo<=c[1].slice(0,7)){const d=F.pm[su];t+=(d._idx||(d._idx=(()=>{const m=new Map();for(const [cc,m2,q] of d.rows){const kk=fkey(cc)+'|'+m2;m.set(kk,(m.get(kk)||0)+q)}return m})())).get(k+'|'+mo)||0}
      else for(const [c2,m2,su2,q] of F.hist)if(su2===su&&m2===mo&&fkey(c2)===k)t+=q}return t};
  return {sucs,ex,wg,sg,months:[...months].sort(),covered,partly,ped};
}

    for(const l of d.plan){const code=asc(l[0]);if(!code||String(l[1]==null?'':l[1]).trim().toUpperCase()==='P')continue;
      const q=num(l[4]),v=num(l[7]);let e=L.get(code);if(!e){e={code,pr:null,g:new Map()};L.set(code,e)}

/* Planilla de Ford "Herramientas y Equipos SRP 4.0" (formato actual): en cada hoja hay una fila de encabezados con
   "N°" (código) y "Descripcion"; se leen todas las hojas que la tengan (Convencionales CC, BS, EVs). Las hojas sin
   columna de código (Generales, Diagnóstico, Híbridos) se saltean. Si ninguna hoja tiene ese encabezado se usa el
   formato viejo "Resumen Herramientas y Equipos": columna A código, B descripción (hoja HH.EE. SRP). */
const HERR_RE=/^(?=.*\d)[A-Z0-9/.\-]{3,}$/i;
const herrH=x=>String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9°º]/g,'');
async function importHerr(f){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const m=new Map(),hojas=[];
  const add=(c,d)=>{c=String(c==null?'':c).replace(/\s+/g,'').trim();d=String(d==null?'':d).replace(/\s+/g,' ').trim();
    if(!c||!HERR_RE.test(c))return;const k=hkey(c);if(k&&!m.has(k))m.set(k,[c,d||'(sin descripción)'])};
  for(const n of wb.SheetNames){if(/backup/i.test(n))continue;const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    let ci=-1,di=-1,hi=-1;
    for(let i=0;i<Math.min(40,aoa.length)&&hi<0;i++){const h=(aoa[i]||[]).map(herrH);
      const c=h.findIndex(x=>['n°','nº','n','no','nro','codigo','numero'].includes(x)),d=h.findIndex(x=>x.startsWith('descripcion'));
      if(c>=0&&d>=0){ci=c;di=d;hi=i}}
    if(hi<0)continue;const antes=m.size;
    for(let i=hi+1;i<aoa.length;i++){const r=aoa[i];if(r)add(r[ci],r[di])}
    hojas.push(`${n.trim()} (${m.size-antes})`);
  }
  if(!m.size){let names=wb.SheetNames.filter(n=>/HH\.?\s*EE/i.test(n)&&!/backup/i.test(n));if(!names.length)names=wb.SheetNames;
    for(const n of names)for(const r of XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})){if(!r)continue;
      const c=String(r[0]==null?'':r[0]).trim(),d=String(r[1]==null?'':r[1]).trim();if(c&&d&&!/\s/.test(c))add(c,d)}}
  if(!m.size){toast('No encontré códigos de herramientas en ese archivo (busco la columna "N°" junto a "Descripcion").');return}
  const man=(S.herr&&S.herr.items||[]).filter(x=>x[2]==='m'&&!m.has(hkey(x[0])));
  const items=[...m.values(),...man];
  await saveHerr(items,{fileName:f.name,loadedAt:new Date().toISOString(),usuario:ME()?ME().email:''},`${fN(m.size)} herramientas especiales cargadas${man.length?` (+${man.length} agregadas a mano)`:''}.`);
  logAct('Cargó herramientas especiales',`${f.name} · ${items.length} códigos${hojas.length?' · '+hojas.join(', '):''}`,'Todas');
}
function herrStockMap(){const m=new Map();if(!S.D.stock)return m;const H=herrSet();
  for(const r of S.D.stock.rows){const k=hkey(r[0]);if(!H.has(k))continue;const q=num(r[2]),v=q*(num(r[3])||0);const o=m.get(k)||{q:0,v:0};o.q+=q;o.v+=v;m.set(k,o)}return m}

/* pedidos por mes y código: se acumulan carga tras carga (el Wings nuevo reemplaza los meses que trae) */
async function mergePedMes(suc,rows){
  if(!rows||!rows.length)return;
  const cur=await readDataset(dsName('pedmes',suc));const months=[...new Set(rows.map(r=>r[1]))].sort(),first=months[0],ms=new Set(months);
  const prevFirst=new Map();const keep=[];
  for(const r of (cur?cur.rows:[])){if(!ms.has(r[1]))keep.push(r);else if(r[1]===first)prevFirst.set(r[0],r[2])}
  const add=rows.map(r=>r[1]===first&&prevFirst.has(r[0])?[r[0],r[1],Math.max(r[2],prevFirst.get(r[0]))]:r);
  for(const [c,q] of prevFirst)if(!rows.some(r=>r[0]===c&&r[1]===first))add.push([c,first,q]);
  await writeDataset(dsName('pedmes',suc),{desde:keep.concat(add).map(r=>r[1]).sort()[0],hasta:months[months.length-1]},keep.concat(add));
  S.pedMes&&delete S.pedMes[suc];
}

function pfParse(rows){

  if(!tipo)throw new Error('No es un reporte de ventas de Autologica. Tiene que ser "Ventas de repuestos a mostrador" (por proveedor y familia) o "Planilla de ventas de repuestos a taller" (por proveedor).');

async function pfFiles(files,hint){
  const p=pfUi();
  for(const f of Array.from(files)){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      if(/ventas perdidas/i.test(String(rows[0]&&rows[0][0]))){await vpLoadFile(f);continue}
      const rep=pfParse(rows);
      const mes=rep.periodo?rep.periodo.mes:p.mes;
      if(mes!==p.mes){p.mes=mes;p.del=null}
      pfDraft(mes)[rep.tipo]={bySuc:rep.bySuc,file:f.name,periodo:rep.periodo};
      const T=pfTot(rep.bySuc,rep.tipo==='taller');
      let t=`${pfQ(T.t)} ${pfUi().modo==='r'?'renglones':'unidades'} origen N`;
      if(hint&&hint!==rep.tipo)t+=` · lo puse en ${rep.tipo} porque es ese reporte`;
      if(rep.periodo&&!rep.periodo.mismoMes)t+=' · Atención: el período abarca más de un mes';
      if(!rep.cuadra)t+=' · Atención: la suma de líneas no coincide con el TOTAL del reporte';
      p.msg[mes+rep.tipo]={t,err:!rep.cuadra||(rep.periodo&&!rep.periodo.mismoMes)};
    }catch(e){p.msg[p.mes+(hint||'mostrador')]={t:(f.name+': '+(e.message||'no se pudo leer')),err:true}}
  }
  render();
}

  return `${vpPending()}
  <section class="panel"><div class="panel-h"><div><h2>Ventas perdidas</h2><p class="sub">Pedidos de clientes que no se pudieron atender. Subí el informe de Autologica <i>Informes de repuestos › Gerenciales › Ventas perdidas › Por usuario</i> (podés traer varios meses juntos: cada carga reemplaza los meses que trae). Arrastralo acá o elegilo.</p></div>
    <div class="toolbar"><label class="btn file pri" data-pfdrop="vp">Cargar informe<input type="file" accept=".xls,.xlsx" data-pffile="vp"></label><button class="btn" data-act="pfVpXls"${F.length?'':' disabled'}>Excel</button><button class="btn" data-act="pfVpPrint"${F.length?'':' disabled'}>Imprimir / PDF</button></div></div>
    ${all.length?`<div class="toolbar vp-filt">
      <label>Desde <select id="vpDesde"><option value="">inicio</option>${opt(meses,v.desde,fMes)}</select></label>
      <label>Hasta <select id="vpHasta"><option value="">hoy</option>${opt(meses,v.hasta,fMes)}</select></label>
      <label>Sucursal <select id="vpSuc"><option value="">Todas</option>${opt(sucs,v.suc)}</select></label>
      <label>Vendedor <select id="vpUsr"><option value="">Todos</option>${opt(usrs,v.usr)}</select></label>
      <label>Origen <select id="vpOrig"${v.orig==='N'?'':' style="border-color:#d97706;background:#fff7ed;color:#9a3412"'}><option value="N"${v.orig==='N'?' selected':''}>N · Original</option><option value="P"${v.orig==='P'?' selected':''}>P · Nacional</option><option value=""${!v.orig?' selected':''}>Todos</option></select></label>
      <div class="seg" role="group" aria-label="Medir en"><button type="button" data-act="pfVpMet" data-k="l" aria-pressed="${v.met!=='u'}">Ventas</button><button type="button" data-act="pfVpMet" data-k="u" aria-pressed="${v.met==='u'}">Unidades</button></div>
    </div>`:''}
    <div class="pf-dropwide" data-pfdrop="vp"${all.length?' hidden':''}><b>Arrastrá acá el informe de ventas perdidas</b><span class="sub" style="margin:0">o tocá “Cargar informe”</span></div>
  </section>
  ${all.length?`
  <div class="tiles">
    <div class="tile"><div class="l">Ventas perdidas</div><div class="v">${fN(F.length)}</div><div class="n">líneas de pedido</div></div>
    <div class="tile"><div class="l">Unidades</div><div class="v">${fN(u)}</div><div class="n">${F.length?fN(u/F.length,1)+' por venta':''}</div></div>
    <div class="tile"><div class="l">Piezas distintas</div><div class="v">${fN(pz)}</div><div class="n">${sucs.length} sucursal${sucs.length>1?'es':''}</div></div>
    <div class="tile"><div class="l">Se repiten</div><div class="v" style="color:${Rp.length?'var(--crit)':'var(--ok)'}">${fN(R.length)}</div><div class="n">${Rp.length?`${Rp.length} fuera del estándar`:'todas en el estándar'}</div></div>
    <div class="tile"><div class="l">Vendedores</div><div class="v">${fN(new Set(F.map(i=>i.u)).size)}</div><div class="n">con ventas perdidas</div></div>
  </div>
  <section class="panel${Rp.length?' vp-alert':''}" id="vpRep"><div class="panel-h"><div><h3>${Rp.length?`⚠ ${Rp.length} pieza${Rp.length>1?'s':''} que se repite${Rp.length>1?'n':''} y no está${Rp.length>1?'n':''} en el estándar`:'Piezas que se repiten'}</h3><p class="sub">Piezas perdidas ${v.min} o más veces en el período elegido. Son candidatas a sumar al estándar stock de la sucursal donde se perdieron. Stock y venta mensual son los últimos cargados de cada sucursal.</p></div>
    <label class="pf-chk">Repetida desde <select id="vpMin">${[2,3,4,5].map(n=>`<option value="${n}"${n===v.min?' selected':''}>${n} veces</option>`).join('')}</select></label></div>
    ${R.length?`<div class="tw" style="max-height:none"><table><thead><tr><th>Código</th><th>Descripción</th><th class="n">Veces</th><th class="n">Unidades</th><th>Meses</th><th>Vendedores</th><th>Última</th><th>Sucursal · estándar</th></tr></thead><tbody>
    ${R.map(x=>`<tr><td class="code">${esc(x.c)}</td><td class="desc" title="${esc(x.d)}">${esc(x.d)}</td><td class="n"><b>${x.n}</b></td><td class="n">${fN(x.q)}</td><td>${[...x.meses].sort().map(fMes).join(', ')}</td><td class="desc">${esc([...x.usrs].join(', '))}</td><td>${fD(x.ult)}</td>
      <td><div class="vp-sucs">${[...x.sucs.entries()].map(([s,n])=>{const L=vpLine(s,x.c),inS=vpInStd(s,x.c),info=L?`stock ${fN(L.st)} · venta ${fN(L.mad,1)}/mes`:S.cache[s]?'sin venta ni stock':'';
        return `<span class="vp-suc">${esc(s)} (${n}) ${inS?'<span class="pill p-ok">en estándar</span>':(S.sucs.includes(s)&&isAdmin()||mySucs().includes(s))?`<button class="btn sm" data-act="pfVpStd" data-c="${esc(x.c)}" data-s="${esc(s)}">+ Estándar</button>`:''}${info?` <span class="faint">${info}</span>`:''}</span>`}).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:14px">Ninguna pieza se perdió ${v.min} o más veces en el período elegido.</div>`}
  </section>
  <div class="vp-grid">
    <section class="panel"><h3 style="margin-bottom:8px">Por mes (${met})</h3><div class="chart">${vpMonthChart(F)}</div></section>
    <section class="panel"><h3 style="margin-bottom:8px">Por sucursal (${met})</h3><div class="chart">${vpHBars(sortE(vpGroup(F,i=>i.s)),{label:'Por sucursal',pl:120})}</div></section>
    <section class="panel"><h3 style="margin-bottom:8px">Por vendedor (${met})</h3><div class="chart">${vpHBars(sortE(vpGroup(F,i=>i.u)),{label:'Por vendedor',pl:120,color:'#2c9a6a'})}</div></section>
    <section class="panel"><h3 style="margin-bottom:8px">Por rubro (${met})</h3><div class="chart">${vpHBars(rubros,{label:'Por rubro',color:'#8a63d2'})}</div></section>
    <section class="panel vp-wide"><h3 style="margin-bottom:8px">Piezas más perdidas (${met}, top 15)</h3><div class="chart">${vpHBars(top,{label:'Piezas más perdidas',color:'#d9822b',W:1100,pl:430,lab:62,full:true})}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h3>Detalle (${fN(D.length)})</h3><input type="search" id="vpQ" placeholder="Buscar código, descripción, vendedor o comprobante" value="${esc(v.q||'')}" style="width:min(100%,340px)"></div>
    <div class="tw"><table><thead><tr><th>Fecha</th><th>Sucursal</th><th>Vendedor</th><th>Comprobante</th><th>Código</th><th>Descripción</th><th>Origen</th><th class="n">Cant.</th></tr></thead><tbody>
    ${D.slice(0,500).map(i=>`<tr><td>${fD(i.f)}</td><td>${esc(i.s)}</td><td>${esc(i.u)}</td><td>${esc(i.tc+' '+i.comp)}</td><td class="code">${esc(i.c)}${rep.has(i.c)?' <span class="pill p-bajo" title="Se repite">repetida</span>':''}</td><td class="desc" title="${esc(i.d)}">${esc(i.d)}</td><td>${esc(i.o)}</td><td class="n">${fN(i.q)}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
}
async function vpLoadFile(f){
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const r=vpParse(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));
    S.vpPend=Object.assign(r,{file:f.name});pfUi().view='vp';render();window.scrollTo({top:0,behavior:'smooth'})}
  catch(e){toast(f.name+': '+(e.message||'no se pudo leer'))}
}
async function vpSave(){
  const p=S.vpPend;if(!p||!db)return;const ms=vpMonths(p.periodo.desde,p.periodo.hasta),meta={archivo:p.file,desde:p.periodo.desde,hasta:p.periodo.hasta,usuario:ME()?ME().email:'',fecha:new Date().toISOString()};
  try{for(const m of ms){const doc=Object.assign({mes:m,items:p.items.filter(i=>i.f.slice(0,7)===m)},meta);await db.doc('vperd/'+m).set(doc);S.vperd=Object.assign({},S.vperd,{[m]:doc})}
    S.vpPend=null;logAct('Cargó ventas perdidas',`${p.items.length} líneas · ${ms.map(fMes).join(', ')}`,'Todas');toast('Ventas perdidas guardadas.');render()}
  catch(e){toast('No se pudo guardar: '+(e.message||e.code))}
}
function vpXls(){
  const F=vpFiltered(),R=vpRepeats(F);
  exportXlsx(`Ventas perdidas ${stamp()}.xlsx`,[
    {name:'Detalle',rows:[['Fecha','Sucursal','Vendedor','Comprobante','Código','Descripción','Origen','Proveedor','Cantidad','Se repite'],...F.sort((a,b)=>a.f.localeCompare(b.f)).map(i=>[i.f,i.s,i.u,i.tc+' '+i.comp,i.c,i.d,i.o,i.pv,i.q,R.some(x=>x.c===i.c)?'Sí':''])]},
    {name:'Repetidas',rows:[['Código','Descripción','Veces','Unidades','Meses','Sucursales','Vendedores','Última','Fuera del estándar en'],...R.map(x=>[x.c,x.d,x.n,x.q,[...x.meses].sort().join(', '),[...x.sucs.entries()].map(([s,n])=>`${s} (${n})`).join(', '),[...x.usrs].join(', '),x.ult,x.pend.join(', ')])]},
    {name:'Por mes',rows:[['Mes','Sucursal','Ventas','Unidades'],...(()=>{const m=new Map();for(const i of F){const k=i.f.slice(0,7)+'|'+i.s;const a=m.get(k)||[0,0];a[0]++;a[1]+=i.q;m.set(k,a)}return [...m.entries()].sort().map(([k,a])=>[...k.split('|'),...a])})()]},
    {name:'Por vendedor',rows:[['Vendedor','Ventas','Unidades'],...(()=>{const m=new Map();for(const i of F){const a=m.get(i.u)||[0,0];a[0]++;a[1]+=i.q;m.set(i.u,a)}return [...m.entries()].sort((a,b)=>b[1][0]-a[1][0]).map(([k,a])=>[k,...a])})()]}
  ]);
}
/* eventos propios de la pestaña */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act^="pf"]');if(!t||S.tab!=='fill')return;const p=pfUi(),a=t.dataset.act;
  if(a==='pfModo'){p.modo=t.dataset.k;render()}
  else if(a==='pfView'){p.view=t.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='pfVpSave'){t.disabled=true;vpSave()}
  else if(a==='pfVpCancel'){S.vpPend=null;render()}
  else if(a==='pfVpMet'){vpUi().met=t.dataset.k;render()}
  else if(a==='pfVpXls')vpXls();
  else if(a==='pfPrint')pfPrint();
  else if(a==='pfVpPrint')vpPrint();
  else if(a==='pfVpStd'){const c=t.dataset.c,sc=t.dataset.s;S.stdBy[sc]=[...new Set([...(S.stdBy[sc]||[]),c])];saveStd();if(sc===stdKey())recompute();logAct('Agregó al estándar',c+' (por ventas perdidas)',sc);toast(`${c} agregada al estándar de ${sc}.`);render()}
  else if(a==='pfSave'){t.disabled=true;pfSave()}
  else if(a==='pfDiscard'){delete p.drafts[p.mes];Object.keys(p.msg).filter(k=>k.startsWith(p.mes)).forEach(k=>delete p.msg[k]);render()}
  else if(a==='pfOpen'){p.mes=t.dataset.k;p.del=null;render();const L=$('#pfLoad');L&&L.scrollIntoView({block:'start',behavior:'smooth'})}
  else if(a==='pfXls')pfXls();
  else if(a==='pfDel'){p.del=p.mes;render()}
  else if(a==='pfDelNo'){p.del=null;render()}
  else if(a==='pfDelYes'){const k=p.del;p.del=null;db.doc('pfill/'+k).delete().then(()=>{const o=Object.assign({},S.pfill);delete o[k];S.pfill=o;logAct('Borró Percent Fill',pfMesL(k),'Todas');toast(pfMesL(k)+' borrado.');render()}).catch(err=>toast('No se pudo borrar: '+(err.message||err.code)))}
});
document.addEventListener('change',e=>{
  const t=e.target;if(S.tab!=='fill')return;const p=pfUi();
  if(t.dataset.pffile){const fs=[...t.files];t.value='';if(fs.length)pfFiles(fs,t.dataset.pffile==='vp'?null:t.dataset.pffile)}
  else if(['vpDesde','vpHasta','vpSuc','vpUsr','vpOrig'].includes(t.id)){vpUi()[t.id.slice(2).toLowerCase()]=t.value;render()}
  else if(t.id==='vpMin'){vpUi().min=+t.value;render()}
  else if(t.id==='pfRd'||t.id==='pfRh'){p[t.id==='pfRd'?'rd':'rh']=t.value;render()}
  else if(t.id==='pfMes'&&/^\d{4}-\d{2}$/.test(t.value)){p.mes=t.value;p.del=null;render()}
  else if(t.id==='pfDp'){p.dp=t.checked;render()}
  else if(t.id==='pfDemM'||t.id==='pfDemO')render();
});
let vpQT;
document.addEventListener('input',e=>{const t=e.target;if(S.tab!=='fill'||t.id!=='vpQ')return;vpUi().q=t.value;clearTimeout(vpQT);vpQT=setTimeout(()=>{const pos=t.selectionStart,y=window.scrollY;render();window.scrollTo(0,y);const n=$('#vpQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)});
document.addEventListener('input',e=>{
  const t=e.target;if(S.tab!=='fill'||(t.id!=='pfDemM'&&t.id!=='pfDemO'))return;
  const p=pfUi(),d=pfDraft(p.mes),k=t.id==='pfDemM'?'demM':'demO';d[k]=t.value===''?null:Math.max(0,num(t.value));
  const M=pfMonth(p.mes);$('#pfCards').innerHTML=pfCards(M,pfCalc(M));const b=document.querySelector('[data-act="pfSave"]');if(b)b.disabled=!db;
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{if(S.tab!=='fill')return;const z=e.target.closest&&e.target.closest('[data-pfdrop]');if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){e.preventDefault();document.querySelectorAll('[data-pfdrop].over').forEach(x=>x!==z&&x.classList.remove('over'));z&&z.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-pfdrop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{if(S.tab!=='fill'||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();const z=e.target.closest&&e.target.closest('[data-pfdrop]');document.querySelectorAll('[data-pfdrop].over').forEach(x=>x.classList.remove('over'));pfFiles(e.dataTransfer.files,z&&z.dataset.pfdrop!=='vp'?z.dataset.pfdrop:null)});

boot();
</script>
</body></html>
